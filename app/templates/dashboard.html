<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f0;
            color: #1a2e1a;
        }
        
        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        /* Header */
        .header {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e2e8e2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        
        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a3e1a;
            margin-bottom: 0.25rem;
        }
        
        .header p {
            font-size: 0.875rem;
            color: #6b8c6b;
        }
        
        /* User Info Card */
        .user-card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e2e8e2;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .user-info h3 {
            font-size: 0.875rem;
            font-weight: 600;
            color: #6b8c6b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
        }
        
        .info-row {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }
        
        .info-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #4a6e4a;
            min-width: 90px;
        }
        
        .info-value {
            font-size: 0.875rem;
            color: #1a3e1a;
            font-weight: 500;
        }
        
        .clearance-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 500;
            background: #e8f5e8;
            color: #2e7d32;
        }
        
        .logout-btn {
            background: #f5f7f5;
            border: 1px solid #d4e0d4;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #5a7a5a;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .logout-btn:hover {
            background: #e8f0e8;
            border-color: #b8ceb8;
            color: #2e5c2e;
        }
        
        /* Documents Section */
        .documents-section {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem 2rem;
            border: 1px solid #e2e8e2;
        }
        
        .section-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: #6b8c6b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1.25rem;
        }
        
        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .doc-item {
            background: #fafdfa;
            border: 1px solid #e2ece2;
            border-radius: 0.75rem;
            padding: 1rem 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .doc-item:hover {
            background: #f5f9f5;
            border-color: #c0d8c0;
            transform: translateX(4px);
        }
        
        .doc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        
        .doc-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a3e1a;
        }
        
        .doc-class-badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.7rem;
            border-radius: 2rem;
            font-weight: 500;
        }
        
        .class-top-secret { background: #e8f0e8; color: #2e5c2e; }
        .class-secret { background: #e8f0e8; color: #2e5c2e; }
        .class-confidential { background: #e8f0e8; color: #2e5c2e; }
        .class-basic { background: #e8f0e8; color: #2e5c2e; }
        
        .doc-meta {
            font-size: 0.75rem;
            color: #7a9a7a;
        }
        
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #8aa88a;
            font-size: 0.875rem;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 46, 26, 0.4);
            backdrop-filter: blur(4px);
        }
        
        .modal-content {
            background: #ffffff;
            margin: 5% auto;
            max-width: 680px;
            width: 90%;
            border-radius: 1rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2ece2;
            animation: modalFadeIn 0.2s ease;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #e8efe8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a3e1a;
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #8aa88a;
            transition: color 0.2s;
        }
        
        .close-modal:hover {
            color: #2e5c2e;
        }
        
        .modal-body {
            padding: 1.5rem;
        }
        
        .doc-meta-info {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            flex-wrap: wrap;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e8efe8;
        }
        
        .doc-meta-item {
            display: flex;
            gap: 0.5rem;
            align-items: baseline;
        }
        
        .doc-meta-label {
            font-weight: 500;
            color: #7a9a7a;
        }
        
        .doc-meta-value {
            color: #2a5c2a;
            font-weight: 500;
        }
        
        .doc-full-content {
            line-height: 1.6;
            font-size: 0.9rem;
            color: #2a3e2a;
            white-space: pre-wrap;
            margin-top: 1rem;
        }
        
        @media (max-width: 640px) {
            .app-container { padding: 1rem; }
            .header, .user-card, .documents-section { padding: 1rem 1.25rem; }
            .info-row { flex-direction: column; gap: 0.25rem; }
            .user-card { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1>Secure Document Access</h1>
            <p>Identity-Aware Proxy | Zero Trust Architecture</p>
        </div>
        
        <!-- User Information -->
        <div class="user-card" id="userInfo">
            <div class="user-info">
                <h3>Session Information</h3>
                <div class="info-row">
                    <span class="info-label">User</span>
                    <span class="info-value" id="usernameDisplay">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Clearance Level</span>
                    <span class="info-value"><span id="clearanceBadge" class="clearance-badge">-</span></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Department</span>
                    <span class="info-value" id="departmentDisplay">-</span>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">Sign Out</button>
        </div>
        
        <!-- Documents Section -->
        <div class="documents-section">
            <div class="section-title">Authorized Documents</div>
            <div id="docListContainer" class="doc-list">
                <div class="empty-state">Loading documents...</div>
            </div>
        </div>
    </div>
    
    <!-- Document Modal -->
    <div id="documentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Document Details</h3>
                <button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="doc-meta-info">
                    <div class="doc-meta-item">
                        <span class="doc-meta-label">Classification</span>
                        <span class="doc-meta-value" id="modalClassification">-</span>
                    </div>
                    <div class="doc-meta-item">
                        <span class="doc-meta-label">Department</span>
                        <span class="doc-meta-value" id="modalDepartment">-</span>
                    </div>
                </div>
                <div class="doc-full-content" id="modalContent">
                    Loading content...
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Parse user data from server
        let userData = null;
        try {
            userData = JSON.parse('{{ user_data | tojson | safe }}');
        } catch (e) {
            console.error('Failed to parse user data', e);
        }
        
        const API_URL = '/api/v1';
        
        function displayUserInfo() {
            if (!userData) return;
            
            document.getElementById('usernameDisplay').textContent = userData.username || 'Unknown';
            document.getElementById('departmentDisplay').textContent = userData.department || 'General';
            
            const clearance = userData.clearance || 'BASIC';
            const clearanceDisplay = clearance === 'TOP_SECRET' ? 'TOP SECRET' : clearance;
            const badgeSpan = document.getElementById('clearanceBadge');
            badgeSpan.textContent = clearanceDisplay;
        }
        
        function getClassBadgeClass(classification) {
            const baseClass = 'doc-class-badge';
            switch(classification) {
                case 'TOP_SECRET': return `${baseClass} class-top-secret`;
                case 'SECRET': return `${baseClass} class-secret`;
                case 'CONFIDENTIAL': return `${baseClass} class-confidential`;
                default: return `${baseClass} class-basic`;
            }
        }
        
        function formatClassification(classification) {
            switch(classification) {
                case 'TOP_SECRET': return 'TOP SECRET';
                default: return classification;
            }
        }
        
        async function loadDocuments() {
            const container = document.getElementById('docListContainer');
            container.innerHTML = '<div class="empty-state">Loading documents...</div>';
            
            try {
                const response = await fetch(`${API_URL}/documents`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (data.documents && data.documents.length > 0) {
                    container.innerHTML = '';
                    data.documents.forEach(doc => {
                        const docDiv = document.createElement('div');
                        docDiv.className = 'doc-item';
                        docDiv.setAttribute('data-doc-id', doc.id);
                        docDiv.onclick = () => viewDocument(doc.id);
                        
                        docDiv.innerHTML = `
                            <div class="doc-header">
                                <span class="doc-title">${escapeHtml(doc.title)}</span>
                                <span class="${getClassBadgeClass(doc.classification)}">${formatClassification(doc.classification)}</span>
                            </div>
                            <div class="doc-meta">Department: ${escapeHtml(doc.department)}</div>
                        `;
                        container.appendChild(docDiv);
                    });
                } else {
                    container.innerHTML = '<div class="empty-state">No documents available with your clearance level</div>';
                }
            } catch (error) {
                console.error('Load error:', error);
                container.innerHTML = '<div class="empty-state">Unable to load documents. Please verify service connectivity.</div>';
            }
        }
        
        async function viewDocument(documentId) {
            const modal = document.getElementById('documentModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalClassification = document.getElementById('modalClassification');
            const modalDepartment = document.getElementById('modalDepartment');
            const modalContent = document.getElementById('modalContent');
            
            modalTitle.textContent = 'Loading...';
            modalClassification.textContent = '-';
            modalDepartment.textContent = '-';
            modalContent.textContent = 'Fetching document content...';
            modal.style.display = 'block';
            
            try {
                const response = await fetch(`${API_URL}/documents/${documentId}`);
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to load document');
                }
                
                const doc = await response.json();
                
                modalTitle.textContent = escapeHtml(doc.title);
                modalClassification.textContent = formatClassification(doc.classification);
                modalDepartment.textContent = escapeHtml(doc.department);
                modalContent.textContent = doc.content || 'No content available';
            } catch (error) {
                modalTitle.textContent = 'Error';
                modalContent.textContent = `Unable to load document: ${error.message}`;
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function logout() {
            window.location.href = '/logout';
        }
        
        // Modal controls
        const modal = document.getElementById('documentModal');
        const closeBtn = document.getElementById('closeModalBtn');
        
        closeBtn.onclick = function() {
            modal.style.display = 'none';
        };
        
        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };
        
        document.getElementById('logoutBtn').addEventListener('click', logout);
        
        // Initialize
        displayUserInfo();
        loadDocuments();
    </script>
</body>
</html>
