<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity-Aware Proxy | Secure Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        
        .login-card {
            background: #ffffff;
            max-width: 440px;
            width: 100%;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8e2;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .logo-icon {
            width: 48px;
            height: 48px;
            background: #e8f5e8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            color: #2e7d32;
            font-weight: 600;
            font-size: 24px;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a2e1a;
            margin-bottom: 0.25rem;
        }
        
        .subtitle {
            font-size: 0.875rem;
            color: #5a6e5a;
            margin-bottom: 1.5rem;
        }
        
        .framework-badge {
            background: #e8f5e8;
            color: #2e5c2e;
            font-size: 0.75rem;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        
        .input-group {
            margin-bottom: 1.25rem;
        }
        
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #2a3e2a;
            margin-bottom: 0.5rem;
        }
        
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            border: 1px solid #cbdccb;
            border-radius: 0.5rem;
            background: #ffffff;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        input:focus {
            outline: none;
            border-color: #4caf50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 0.5rem;
            font-family: inherit;
        }
        
        .login-btn:hover {
            background: #388e3c;
        }
        
        .error-message {
            background: #ffefef;
            color: #c62828;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            margin-bottom: 1rem;
            display: none;
            border-left: 3px solid #c62828;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e0e8e0;
            border-top-color: #4caf50;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.5rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .credentials-panel {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #e8efe8;
        }
        
        .credentials-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a8e7a;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }
        
        .credential-row {
            font-size: 0.75rem;
            padding: 0.5rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f0f4f0;
        }
        
        .credential-user {
            font-family: 'Menlo', monospace;
            font-weight: 500;
            color: #2a5c2a;
        }
        
        .credential-pass {
            font-family: 'Menlo', monospace;
            color: #6b8c6b;
        }
        
        .credential-badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            font-weight: 500;
        }
        
        .badge-top-secret { background: #e8f0e8; color: #2e5c2e; }
        .badge-secret { background: #e8f0e8; color: #2e5c2e; }
        .badge-basic { background: #e8f0e8; color: #2e5c2e; }
        
        .footer-note {
            font-size: 0.7rem;
            color: #8aa08a;
            text-align: center;
            margin-top: 1.5rem;
        }
        
        @media (max-width: 480px) {
            .login-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-section">
            <div class="logo-icon">IAP</div>
            <h1>Secure Access Portal</h1>
            <div class="subtitle">Identity-Aware Proxy Authentication</div>
        </div>
        
        <div class="framework-badge">
            Zero Trust Architecture | IAP Model Framework 
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="font-size: 0.75rem; color: #6b8c6b;">Authenticating...</p>
        </div>
        
        <div class="credentials-panel">
            <div class="credentials-title">Test Access Credentials</div>
            <div class="credential-row">
                <span class="credential-user">intelligence_officer</span>
                <span class="credential-pass">pass123</span>
                <span class="credential-badge badge-top-secret">TOP SECRET</span>
            </div>
            <div class="credential-row">
                <span class="credential-user">defense_staff</span>
                <span class="credential-pass">pass123</span>
                <span class="credential-badge badge-secret">SECRET</span>
            </div>
            <div class="credential-row">
                <span class="credential-user">general_user</span>
                <span class="credential-pass">pass123</span>
                <span class="credential-badge badge-basic">BASIC</span>
            </div>
        </div>
        
        <div class="footer-note">
            RSA+AES Encrypted Document Storage
        </div>
    </div>
    
    <script>
        const AUTH_URL = 'https://localhost:8501';
        const REDIRECT_URL = new URLSearchParams(window.location.search).get('redirect_url') || '/dashboard';
        
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('errorMessage');
        const loadingDiv = document.getElementById('loading');
        
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            errorDiv.style.display = 'none';
        }
        
        function setLoading(isLoading) {
            loadingDiv.style.display = isLoading ? 'block' : 'none';
            form.querySelector('.login-btn').disabled = isLoading;
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            hideError();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }
            
            setLoading(true);
            
            try {
                const response = await fetch(`${AUTH_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Authentication failed');
                }
                
                if (data.token) {
                    window.location.href = `/callback?token=${data.token}&redirect_url=${REDIRECT_URL}`;
                } else {
                    throw new Error('Invalid server response');
                }
            } catch (error) {
                showError(error.message);
                setLoading(false);
            }
        }
        
        form.addEventListener('submit', handleLogin);
        usernameInput.addEventListener('input', hideError);
        passwordInput.addEventListener('input', hideError);
    </script>
</body>
</html>
