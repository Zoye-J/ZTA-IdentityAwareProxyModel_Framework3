<!DOCTYPE html>
<html>
<head>
    <title>IAP Login - Identity-Aware Proxy</title>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            text-align: center;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.3s;
        }
        
        .btn-login:hover {
            opacity: 0.9;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info-box {
            background: #e3f2fd;
            color: #1976d2;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 12px;
            text-align: center;
        }
        
        .credentials-box {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        
        .credentials-box p {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .credentials-box .cred-row {
            font-family: monospace;
            font-size: 11px;
            padding: 4px 0;
            color: #333;
        }
        
        .credentials-box strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 IAP Login</h1>
        <div class="subtitle">Identity-Aware Proxy - Zero Trust Access</div>
        
        <div class="info-box">
            🔐 Framework 3: IAP Model with RSA+AES Encryption
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px;">Authenticating...</p>
        </div>
        
        <form id="loginForm" onsubmit="manualLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        
        <div class="credentials-box">
            <p><strong>📝 Test Credentials:</strong></p>
            <div class="cred-row">• <strong>intelligence_officer</strong> / pass123 <span style="color:#9C27B0;">(TOP_SECRET - Intelligence)</span></div>
            <div class="cred-row">• <strong>defense_staff</strong> / pass123 <span style="color:#f44336;">(SECRET - Defense)</span></div>
            <div class="cred-row">• <strong>general_user</strong> / pass123 <span style="color:#4CAF50;">(BASIC - General)</span></div>
        </div>
    </div>
    
    <script>
        const AUTH_URL = 'https://localhost:8501';
        const REDIRECT_URL = new URLSearchParams(window.location.search).get('redirect_url') || '/dashboard';
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';
        }
        
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }
        
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        async function manualLogin(event) {
            event.preventDefault();
            hideError();
            showLoading();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showError('Please enter username and password');
                hideLoading();
                return;
            }
            
            try {
                const response = await fetch(`${AUTH_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Invalid credentials');
                }
                
                const data = await response.json();
                
                if (data.token) {
                    window.location.href = `/callback?token=${data.token}&redirect_url=${REDIRECT_URL}`;
                } else {
                    throw new Error('No token received');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Login failed: ' + error.message);
                hideLoading();
            }
        }
        
        // Clear error when typing
        document.getElementById('username').addEventListener('input', hideError);
        document.getElementById('password').addEventListener('input', hideError);
    </script>
</body>
</html>
